<!doctype html>
<!--
  macOS browser-window frame for README screenshots.
  Query params: img (path to raw screenshot), url (address bar text), title (tab title).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      body {
        padding: 56px 64px 80px;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      }
      .window {
        width: 1440px;
        border-radius: 12px;
        overflow: hidden;
        background: #1c1c24;
        box-shadow:
          0 0 0 0.5px rgba(0, 0, 0, 0.6),
          inset 0 0 0 0.5px rgba(255, 255, 255, 0.12),
          0 22px 70px 4px rgba(0, 0, 0, 0.45),
          0 8px 24px rgba(0, 0, 0, 0.25);
      }
      .toolbar {
        height: 52px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        gap: 14px;
        background: linear-gradient(#2a2a33, #24242c);
        border-bottom: 1px solid #0e0e14;
      }
      .lights {
        display: flex;
        gap: 8px;
        width: 220px;
      }
      .lights span {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.25);
      }
      .lights span:nth-child(1) {
        background: #ff5f57;
      }
      .lights span:nth-child(2) {
        background: #febc2e;
      }
      .lights span:nth-child(3) {
        background: #28c840;
      }
      .nav {
        display: flex;
        gap: 18px;
        color: #8a8a96;
        margin-left: -140px;
      }
      .nav svg {
        width: 14px;
        height: 14px;
      }
      .address {
        flex: 1;
        display: flex;
        justify-content: center;
      }
      .field {
        width: 520px;
        height: 30px;
        border-radius: 8px;
        background: #3a3a44;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        color: #e4e4ea;
        font-size: 13px;
        letter-spacing: 0.1px;
      }
      .field svg {
        width: 11px;
        height: 11px;
        color: #a8a8b4;
      }
      .actions {
        width: 220px;
        display: flex;
        justify-content: flex-end;
        gap: 18px;
        color: #8a8a96;
      }
      .actions svg {
        width: 15px;
        height: 15px;
      }
      .content img {
        display: block;
        width: 1440px;
        height: 900px;
      }
    </style>
  </head>
  <body>
    <div class="window">
      <div class="toolbar">
        <div class="lights"><span></span><span></span><span></span></div>
        <div class="nav">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M10 3 5 8l5 5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <svg
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            opacity="0.5"
          >
            <path d="m6 3 5 5-5 5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <div class="address">
          <div class="field">
            <svg viewBox="0 0 12 14" fill="currentColor">
              <path
                d="M6 0a3.5 3.5 0 0 0-3.5 3.5V6H2a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1h-.5V3.5A3.5 3.5 0 0 0 6 0Zm2 6H4V3.5a2 2 0 1 1 4 0V6Z"
              />
            </svg>
            <span id="url"></span>
          </div>
        </div>
        <div class="actions">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path
              d="M8 2v8M5 5l3-3 3 3M3 9v4h10V9"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M8 3v10M3 8h10" stroke-linecap="round" />
          </svg>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="2" y="2" width="9" height="9" rx="2" />
            <path d="M5 14h7a2 2 0 0 0 2-2V5" stroke-linecap="round" />
          </svg>
        </div>
      </div>
      <div class="content"><img id="shot" alt="" /></div>
    </div>
    <script>
      const p = new URLSearchParams(location.search);
      document.getElementById('shot').src = p.get('img');
      document.getElementById('url').textContent = p.get('url') || 'localhost:6006';
    </script>
  </body>
</html>
